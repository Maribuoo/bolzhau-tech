<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bolzhau.Tech</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070F;--bg2:#0C0C1A;--bg3:#101020;
  --p:#7B3FF2;--p2:#9F7AEA;--p3:#C4B5FD;
  --glow:rgba(123,63,242,.3);--border:rgba(123,63,242,.18);
  --text:#F5F5FF;--muted:#6B6B8A;--card:rgba(16,16,32,.9)
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--p);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px var(--glow)}50%{box-shadow:0 0 50px var(--glow),0 0 80px rgba(123,63,242,.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dots{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fade-up{animation:fadeUp .6s ease forwards}
.fade-up-2{animation:fadeUp .6s .15s ease forwards;opacity:0}
.fade-up-3{animation:fadeUp .6s .3s ease forwards;opacity:0}
nav{position:sticky;top:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(7,7,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;background:linear-gradient(135deg,#fff 20%,var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links li{font-size:13px;color:var(--muted);cursor:pointer;transition:color .2s;padding:4px 0;border-bottom:2px solid transparent;transition:all .2s}
.nav-links li:hover,.nav-links li.active{color:var(--text);border-bottom-color:var(--p)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.lang.active,.lang:hover{color:var(--text);border-color:var(--p);background:rgba(123,63,242,.12)}
.btn{border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;font-size:14px;font-weight:500}
.btn-purple{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px 26px;border-radius:8px}
.btn-purple:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--glow)}
.btn-purple:active{transform:translateY(0)}
.btn-outline{background:transparent;color:var(--p3);border:1px solid var(--border);padding:9px 22px;border-radius:8px}
.btn-outline:hover{background:rgba(123,63,242,.1);border-color:var(--p)}
.btn-sm{padding:6px 16px;font-size:12px;border-radius:6px}
section{padding:80px 0}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
h1.hero-title{font-family:'Unbounded',sans-serif;font-size:clamp(48px,9vw,100px);font-weight:800;line-height:.95;background:linear-gradient(135deg,#fff 30%,var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
.hero-sub{font-size:17px;color:var(--muted);max-width:480px;line-height:1.7;margin-bottom:36px}
.grid-pattern{background-image:radial-gradient(circle at 15% 50%,rgba(123,63,242,.18) 0%,transparent 50%),radial-gradient(circle at 85% 20%,rgba(159,122,234,.12) 0%,transparent 40%),linear-gradient(rgba(123,63,242,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(123,63,242,.04) 1px,transparent 1px);background-size:100% 100%,100% 100%,44px 44px,44px 44px}
.hero{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 32px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(123,63,242,.12) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;transition:all .3s}
.card:hover{border-color:rgba(123,63,242,.4);transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card-top{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:14px 14px 0 0;margin:-24px -24px 20px;opacity:0;transition:opacity .3s}
.card:hover .card-top{opacity:1}
.badge{display:inline-block;background:rgba(123,63,242,.15);color:var(--p3);font-size:10px;font-weight:600;letter-spacing:.12em;padding:3px 10px;border-radius:20px;border:1px solid rgba(123,63,242,.25);text-transform:uppercase}
.badge-green{background:rgba(74,222,128,.1);color:#4ade80;border-color:rgba(74,222,128,.2)}
.accuracy{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#4ade80;margin-top:12px}
.accuracy::before{content:'';display:block;width:6px;height:6px;background:#4ade80;border-radius:50%}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px;border:2px solid rgba(123,63,242,.3);font-family:'Inter',sans-serif;color:#fff;font-weight:600}
.section-title{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;text-align:center;margin-bottom:48px}
.section-title span{-webkit-text-fill-color:transparent;background:linear-gradient(135deg,var(--p2),var(--p3));-webkit-background-clip:text}
input,textarea{background:rgba(16,16,32,.8);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px 16px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(123,63,242,.12)}
input::placeholder,textarea::placeholder{color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;letter-spacing:.02em}
.form-group{margin-bottom:18px}
.predict-wrap{min-height:calc(100vh - 60px);padding:32px}
.main-ta{width:100%;min-height:110px;background:rgba(12,12,26,.9);border:1px solid var(--border);border-radius:12px;padding:20px 24px;font-size:17px;color:var(--text);font-family:'Inter',sans-serif;resize:none;outline:none;line-height:1.6;transition:border-color .2s}
.main-ta:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(123,63,242,.08)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px}
kbd{background:rgba(123,63,242,.15);border:1px solid rgba(123,63,242,.3);color:var(--p3);font-size:11px;padding:2px 7px;border-radius:4px;font-family:'Inter',monospace}
.pred-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:24px}
.pred-col{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pred-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.pred-head-left{display:flex;align-items:center;gap:8px}
.pred-model{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--p3);background:rgba(123,63,242,.15);padding:2px 8px;border-radius:4px;border:1px solid rgba(123,63,242,.25)}
.pred-title{font-size:13px;font-weight:600}
.pred-item{display:flex;align-items:center;padding:10px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(123,63,242,.05);gap:12px}
.pred-item:hover{background:rgba(123,63,242,.08)}
.pred-item:last-child{border-bottom:none}
.pred-num{font-size:11px;color:var(--muted);width:16px;flex-shrink:0}
.pred-text{font-size:14px;flex:1;color:var(--text)}
.pred-bar-wrap{width:60px;flex-shrink:0}
.pred-bar{height:3px;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:2px}
.pred-pct{font-size:11px;color:var(--muted);width:30px;text-align:right;flex-shrink:0}
.empty-state{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}
.loading-dots span{display:inline-block;width:5px;height:5px;background:var(--p2);border-radius:50%;margin:0 3px;animation:dots 1.4s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
.auth-page{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.auth-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--muted);margin-bottom:32px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.link{color:var(--p2);cursor:pointer;font-size:13px}
.link:hover{color:var(--p3);text-decoration:underline}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.succ{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);color:#4ade80;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.partner-row{display:flex;align-items:center;justify-content:center;gap:48px;padding:32px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:48px 0}
.partner{font-family:'Unbounded',sans-serif;font-size:13px;color:var(--muted);letter-spacing:.05em}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.contact-info-item{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}
.contact-icon{width:40px;height:40px;background:rgba(123,63,242,.15);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
footer{border-top:1px solid var(--border);padding:32px;text-align:center;color:var(--muted);font-size:13px}
.mode-tabs{display:flex;gap:8px;margin-bottom:20px}
.mode-tab{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Inter',sans-serif}
.mode-tab.active{background:rgba(123,63,242,.2);border-color:var(--p);color:var(--text)}
.inserted-word{background:rgba(123,63,242,.2);color:var(--p3);border-radius:4px;padding:0 2px}
@media(max-width:900px){
  .grid-4{grid-template-columns:1fr 1fr}
  .pred-cols{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
  nav{padding:0 20px}
  .nav-links{gap:16px}
}
@media(max-width:600px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  nav{padding:0 16px}
  .nav-links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

const BACKEND = 'http://localhost:5000';

// ── mock predictions (fallback when backend offline) ──────────────
const MOCK = {
  WORD_END: [
    {text:'...та',confidence:98},{text:'...қа',confidence:75},
    {text:'...тағы',confidence:42},{text:'...ты',confidence:15}
  ],
  NEXT_WORD: [
    {text:'үшін',confidence:92},{text:'керек',confidence:68},
    {text:'емес',confidence:37},{text:'бар',confidence:22}
  ],
  PHRASE: [
    {text:'бағындырар белестер',confidence:92},
    {text:'бағдарламасы барлығы',confidence:68},
    {text:'жоспарлар маңызды',confidence:37},
    {text:'үшін де қажет',confidence:22}
  ]
};

// ── Navbar ────────────────────────────────────────────────────────
function Navbar({page,setPage,user,setUser,lang,setLang}){
  const links=[
    {id:'predict',label:'Болжау'},
    {id:'translate',label:'Аудару'},
    {id:'chat',label:'Тілдесу'},
    {id:'contact',label:'Байланысу'}
  ];
  return(
    <nav>
      <div className="logo" onClick={()=>setPage('home')}>
        {page==='predict'?'Bolzhau.AI':'Bolzhau.Tech'}
      </div>
      <ul className="nav-links">
        {links.map(l=>(
          <li key={l.id} className={page===l.id?'active':''}
              onClick={()=>setPage(l.id)}>{l.label}</li>
        ))}
      </ul>
      <div className="nav-right">
        <button className={`lang ${lang==='КАЗ'?'active':''}`}
                onClick={()=>setLang('КАЗ')}>ҚАЗ</button>
        <button className={`lang ${lang==='QAZ'?'active':''}`}
                onClick={()=>setLang('QAZ')}>QAZ</button>
        {user
          ? <button className="btn btn-outline btn-sm"
                    onClick={()=>setUser(null)}>Шығу</button>
          : <>
              <button className="btn btn-outline btn-sm"
                      onClick={()=>setPage('login')}>Кіру</button>
              <button className="btn btn-purple btn-sm"
                      onClick={()=>setPage('register')}>Тіркелу</button>
            </>
        }
      </div>
    </nav>
  );
}

// ── Home page ─────────────────────────────────────────────────────

  return(
    <div>
      {/* HERO */}
      <section className="hero grid-pattern">
        <h1 className="hero-title fade-up">Bolzhau.Tech</h1>

        <div style={{display:'flex',gap:12}} className="fade-up-3">
          <button className="btn btn-purple" onClick={()=>setPage('predict')}>
            Болжауды бастау →
          </button>
          <button className="btn btn-outline" onClick={()=>{}}>
            Толығырақ білу
          </button>
        </div>
      </section>

      {/* PARTNERS */}
      <div className="wrap">
        <div className="partner-row">
          <span className="partner">◎ AITU</span>
          <span className="partner">▣ DGSC</span>
          <span className="partner">◆ DIGITAL COMMAND CENTER</span>
        </div>
      </div>

      {/* TEAM */}
      <section className="wrap">
        <h2 className="section-title">Біздің <span>топ</span></h2>
        <div className="grid-4">
          {[
            {name:'Базаралы Қанат',role:'Жоба жетекшісі',desc:'Команданың жұмысын үйлестіреді және жобаның сәтті жүзеге асуына жауапты',em:'🎯'},
            {name:'Әбу Мариям',role:'Әзірлеуші',desc:'Бағдарламалық қамтамасыз етуді әзірлейді және жаңа технологияларды енгізеді',em:'⚙️'},
            {name:'Құсайын Дінмұхаммед',role:'Әзірлеуші',desc:'Бағдарламалық қамтамасыз етуді әзірлейді және жаңа технологияларды енгізеді',em:'🔧'},
            {name:'Аштаева Аяулым',role:'UX/UI дизайнер',desc:'Қолданушы тәжірибесін жақсартып, интерфейсті ыңғайлы етіп жасайды',em:'🎨'},
          ].map((m,i)=>(
            <div className="card team-card" key={i}>
              <div className="card-top"/>
              <div className="avatar">{m.em}</div>

              <p style={{fontSize:12,color:'var(--muted)',lineHeight:1.6}}>{m.desc}</p>
            </div>

      {/* MODELS */}
      <section className="wrap">

        <div className="grid-3" style={{gridTemplateColumns:'1fr 1fr',gap:20}}>
          {[
            {tag:'KERAS MODEL',title:'Сөздің соңы',icon:'🧠',
             desc:'Қазақ тілінің морфологиялық ерекшеліктерін ескере отырып, сөздердің дұрыс жалғауларын болжайды',
             ex:'қала → қалада, қаладан, қалаға',acc:'96.2%'},
            {tag:'BIGRAM WORD',title:'Келесі сөз',icon:'📝',
             desc:'Контекстік талдау арқылы келесі келетін сөзді болжап, жазу процесін жылдамдатады',
             ex:'Мен бүгін → мектепке, үйге, жұмысқа',acc:'94.8%'},
            {tag:'TRIGRAM MODEL',title:'Фраза',icon:'💬',
             desc:'Сөйлемнің логикалық құрылымын сақтай отырып, толық фразаларды аяқтайды',
             ex:'Қазақстан менің → туған жерім',acc:'96.2%'},
          ].map((m,i)=>(
            <div className="card" key={i} style={i===2?{gridColumn:'1/3'}:{}}>

              </div>
              <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.7,marginBottom:12}}>{m.desc}</p>
              <div style={{background:'rgba(123,63,242,.08)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',fontFamily:'monospace',fontSize:12,color:'var(--p3)',marginBottom:8}}>
                {m.ex}
              </div>
              <div className="accuracy">Дәлдік дәрежесі {m.acc}</div>

          ))}
        </div>
      </section>

      {/* CONTACT */}
      <section className="wrap">
        <h2 className="section-title"><span>Байланыс</span></h2>
        <div className="contact-grid">
          <div>
            <h3 style={{fontSize:20,fontWeight:600,marginBottom:24}}>Бізбен байланыс</h3>
            {[
              {icon:'📧',label:'Электрондық пошта',val:'info@bolzhau.tech'},
              {icon:'📍',label:'Мекен-жайымыз',val:'Астана қаласы, Мангилік ел С2/4'},
              {icon:'📞',label:'Телефон',val:'+7 (7172) 777-777'},
            ].map((c,i)=>(
              <div className="contact-info-item" key={i}>
                <div className="contact-icon">{c.icon}</div>

                  <div style={{fontSize:12,color:'var(--muted)',marginBottom:2}}>{c.label}</div>

                </div>
              </div>
            ))}
          </div>
          <div>
            <h3 style={{fontSize:20,fontWeight:600,marginBottom:24}}>Хабарласу формасы</h3>

      <footer>

// ── Contact Form ──────────────────────────────────────────────────
function ContactForm(){
  const [f,setF]=useState({name:'',email:'',phone:'',message:''});
  const [sent,setSent]=useState(false);
  const [loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!f.name||!f.email||!f.message)return;
    setLoading(true);
    try{
      await fetch(`${BACKEND}/api/feedback`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(f)
      });
    }catch(e){}
    setLoading(false);setSent(true);
    setTimeout(()=>setSent(false),4000);
  };

  if(sent) return <div className="succ">✓ Хабарлама жіберілді!</div>;
  return(
    <div>
      <div className="form-group">
        <label>Аты-жөніңіз</label>
        <input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Атыңыз"/>
      </div>
      <div className="form-group">
        <label>Электрондық пошта</label>

// ── Predict Page ──────────────────────────────────────────────────
function PredictPage({user,setPage}){
  const [text,setText]=useState('');
  const [preds,setPreds]=useState({WORD_END:[],NEXT_WORD:[],PHRASE:[]});
  const [loading,setLoading]=useState(false);
  const timerRef=useRef(null);

  const fetchPreds=useCallback(async(t)=>{
    if(!t.trim()){setPreds({WORD_END:[],NEXT_WORD:[],PHRASE:[]});return;}
    setLoading(true);
    try{
      const results={};
      for(const mode of['WORD_END','NEXT_WORD','PHRASE']){
        const r=await fetch(`${BACKEND}/api/predict`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text:t,mode}),
          signal:AbortSignal.timeout(5000)
        });
        const d=await r.json();
        results[mode]=d.suggestions||[];
      }
      setPreds(results);
    }catch{
      // offline — use mock data
      setPreds(MOCK);
    }
    setLoading(false);
  },[]);

  const handleKey=useCallback(e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const top=preds.WORD_END[0]||preds.NEXT_WORD[0]||preds.PHRASE[0];
      if(top) setText(p=>p+' '+top.text.replace(/\.\.\./g,''));
    }
    if(e.ctrlKey&&e.key==='1'&&preds.WORD_END[0]){
      e.preventDefault();setText(p=>p+preds.WORD_END[0].text.replace(/\.\.\./g,''));
    }
    if(e.ctrlKey&&e.key==='2'&&preds.NEXT_WORD[0]){
      e.preventDefault();setText(p=>p+' '+preds.NEXT_WORD[0].text);
    }
    if(e.ctrlKey&&e.key==='3'&&preds.PHRASE[0]){
      e.preventDefault();setText(p=>p+' '+preds.PHRASE[0].text);
    }
  },[preds]);

  useEffect(()=>{
    clearTimeout(timerRef.current);
    timerRef.current=setTimeout(()=>fetchPreds(text),300);
  },[text,fetchPreds]);

  const insertPred=(t,mode)=>{
    if(mode==='WORD_END') setText(p=>p+t.replace(/\.\.\./g,''));
    else setText(p=>p+' '+t);
  };

  const cols=[
    {mode:'WORD_END',model:'KERAS',title:'Сөздің соңы',shortcut:'Ctrl + 1'},
    {mode:'NEXT_WORD',model:'BIGRAM',title:'Келесі сөз',shortcut:'Ctrl + 2'},
    {mode:'PHRASE',model:'TRIGRAM',title:'Фраза',shortcut:'Ctrl + 3'},
  ];

  return(
    <div className="predict-wrap">
      {/* Input area */}
      <textarea
        className="main-ta"
        value={text}
        onChange={e=>setText(e.target.value)}
        onKeyDown={handleKey}
        placeholder="Мәтінді осы жерге енгізіңіз..."
        autoFocus
      />
      <div className="hint">
        <span>💡</span>
        <kbd>Tab</kbd> — ең ықтимал болжамды қосу
        <kbd>Ctrl+1</kbd><kbd>Ctrl+2</kbd><kbd>Ctrl+3</kbd> — нақты модельден қосу
      </div>

      {loading&&(
        <div style={{textAlign:'center',padding:'20px 0',color:'var(--muted)'}}>
          <div className="loading-dots"><span/><span/><span/></div>
        </div>
      )}

      {/* Prediction columns */}
      <div className="pred-cols">
        {cols.map(col=>(
          <div className="pred-col" key={col.mode}>
            <div className="pred-head">
              <div className="pred-head-left">
                <span className="pred-model">{col.model}</span>
                <span className="pred-title">{col.title}</span>
              </div>
              <kbd>{col.shortcut}</kbd>
            </div>
            {!loading&&preds[col.mode]?.length===0&&(
              <div className="empty-state">Мәтін енгізіңіз...</div>
            )}
            {preds[col.mode]?.map((p,i)=>(
              <div className="pred-item" key={i}
                   onClick={()=>insertPred(p.text,col.mode)}>
                <span className="pred-num">{i+1}.</span>
                <span className="pred-text">{p.text}</span>
                <div className="pred-bar-wrap">
                  <div className="pred-bar" style={{width:`${p.confidence||0}%`}}/>
                </div>
                <span className="pred-pct">{p.confidence||0}%</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Login Page ────────────────────────────────────────────────────
function LoginPage({setPage,setUser}){
  const [f,setF]=useState({email:'',password:''});
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const submit=async()=>{
    setErr('');
    if(!f.email||!f.password){setErr('Барлық өрістерді толтырыңыз');return;}
    setLoading(true);
    try{
      const r=await fetch(`${BACKEND}/api/auth/login`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(f)
      });
      const d=await r.json();
      if(d.token){
        localStorage.setItem('token',d.token);
        setUser({email:f.email,name:d.name||f.email});
        setPage('predict');
      }else{
        setErr(d.error||'Email немесе пароль қате');
      }
    }catch{
      // demo mode — accept any login
      setUser({email:f.email,name:f.email.split('@')[0]});
      setPage('predict');
    }
    setLoading(false);
  };

  return(
    <div className="auth-page">
      <div className="auth-card">
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:20,background:'linear-gradient(135deg,#fff,var(--p3))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',marginBottom:4}}>
            Болжау.Tech
          </div>
          <div className="auth-title">Жүйеге кіру</div>
          <div className="auth-sub">Аккаунтыңызға кіріңіз</div>
        </div>
        {err&&<div className="err">{err}</div>}
        <div className="form-group">
          <label>Электрондық пошта</label>
          <input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="email@example.com"/>
        </div>
        <div className="form-group">
          <label>Құпия сөз</label>
          <input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})}
                 placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&submit()}/>
        </div>
        <div style={{textAlign:'right',marginBottom:20}}>
          <span className="link">Құпия сөзді ұмыттыңыз ба?</span>
        </div>
        <button className="btn btn-purple" style={{width:'100%',padding:'13px'}} onClick={submit} disabled={loading}>
          {loading?<span className="loading-dots"><span/><span/><span/></span>:'Кіру'}
        </button>
        <div className="divider">немесе</div>
        <div style={{textAlign:'center',fontSize:13,color:'var(--muted)'}}>
          Аккаунт жоқ па?{' '}
          <span className="link" onClick={()=>setPage('register')}>Тіркелу</span>
        </div>
      </div>
    </div>
  );
}

// ── Register Page ─────────────────────────────────────────────────
function RegisterPage({setPage,setUser}){
  const [f,setF]=useState({name:'',email:'',password:'',confirm:''});
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const submit=async()=>{
    setErr('');
    if(!f.name||!f.email||!f.password){setErr('Барлық өрістерді толтырыңыз');return;}
    if(f.password!==f.confirm){setErr('Құпия сөздер сәйкес емес');return;}
    if(f.password.length<6){setErr('Кем дегенде 6 таңба болуы керек');return;}
    setLoading(true);
    try{
      const r=await fetch(`${BACKEND}/api/auth/register`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:f.name,email:f.email,password:f.password})
      });
      const d=await r.json();
      if(d.token){
        localStorage.setItem('token',d.token);
        setUser({email:f.email,name:f.name});
        setPage('predict');
      }else{
        setErr(d.error||'Тіркелу сәтсіз аяқталды');
      }
    }catch{
      // demo mode
      setUser({email:f.email,name:f.name});
      setPage('predict');
    }
    setLoading(false);
  };

  return(
    <div className="auth-page">
      <div className="auth-card">
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:20,background:'linear-gradient(135deg,#fff,var(--p3))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',marginBottom:4}}>
            Болжау.Tech
          </div>
          <div className="auth-title">Тіркелу</div>
          <div className="auth-sub">Жаңа аккаунт жасаңыз</div>
        </div>
        {err&&<div className="err">{err}</div>}
        <div className="form-group">
          <label>Аты-жөніңіз</label>
          <input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Толық атыңыз"/>
        </div>
        <div className="form-group">
          <label>Электрондық пошта</label>
          <input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="email@example.com"/>
        </div>
        <div className="form-group">
          <label>Құпия сөз</label>
          <input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} placeholder="Кем дегенде 6 таңба"/>
        </div>
        <div className="form-group">
          <label>Құпия сөзді растаңыз</label>
          <input type="password" value={f.confirm} onChange={e=>setF({...f,confirm:e.target.value})}
                 placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&submit()}/>
        </div>
        <button className="btn btn-purple" style={{width:'100%',padding:'13px'}} onClick={submit} disabled={loading}>
          {loading?<span className="loading-dots"><span/><span/><span/></span>:'Тіркелу'}
        </button>
        <div className="divider">немесе</div>
        <div style={{textAlign:'center',fontSize:13,color:'var(--muted)'}}>
          Аккаунт бар ма?{' '}
          <span className="link" onClick={()=>setPage('login')}>Кіру</span>
        </div>
      </div>
    </div>
  );
}

// ── Translate placeholder ─────────────────────────────────────────
function TranslatePage(){

  const translate=async()=>{
    if(!src.trim())return;
    setLoading(true);
    try{
      const r=await fetch(`${BACKEND}/api/translate`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:src,from:'kk',to:'ru'})
      });
      const d=await r.json();
      setTgt(d.result||'Аударма қызметі жақында қосылады...');

  return(

        <div>
          <label style={{marginBottom:8,display:'block'}}>Қазақша</label>

      </div>
    </div>

}

// ── Chat placeholder ──────────────────────────────────────────────
function ChatPage(){
  const [msgs,setMsgs]=useState([
    {from:'bot',text:'Сәлем! Мен Bolzhau AI. Қазақ тілінде сұрақтарыңызға жауап бере аламын.'}
  ]);
  const [input,setInput]=useState('');
  const endRef=useRef(null);

  useEffect(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),[msgs]);

  const send=async()=>{
    if(!input.trim())return;
    const userMsg=input;
    setInput('');
    setMsgs(m=>[...m,{from:'user',text:userMsg}]);
    try{
      const r=await fetch(`${BACKEND}/api/chat`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:userMsg})
      });
      const d=await r.json();
      setMsgs(m=>[...m,{from:'bot',text:d.reply||'Жауап жоқ'}]);
    }catch{
      setMsgs(m=>[...m,{from:'bot',text:'⚙️ Тілдесу қызметі жақында қосылады...'}]);
    }
  };

  return(
    <div style={{padding:32,maxWidth:760,margin:'0 auto',height:'calc(100vh - 60px)',display:'flex',flexDirection:'column'}}>
      <h2 style={{fontFamily:"'Unbounded',sans-serif",fontSize:22,marginBottom:4}}>Тілдесу</h2>
      <p style={{color:'var(--muted)',marginBottom:20,fontSize:13}}>Bolzhau AI-мен сөйлесіңіз</p>
      <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:12,paddingBottom:16}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.from==='user'?'flex-end':'flex-start'}}>
            <div style={{
              maxWidth:'70%',padding:'10px 16px',borderRadius:12,fontSize:14,lineHeight:1.6,
              background:m.from==='user'?'linear-gradient(135deg,var(--p),var(--p2))':'var(--bg2)',
              border:m.from==='user'?'none':'1px solid var(--border)',
              color:'var(--text)'
            }}>{m.text}</div>
          </div>
        ))}
        <div ref={endRef}/>
      </div>
      <div style={{display:'flex',gap:12}}>
        <input value={input} onChange={e=>setInput(e.target.value)}
               onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Хабарлама жазыңыз..."/>
        <button className="btn btn-purple" style={{flexShrink:0,padding:'12px 20px'}} onClick={send}>→</button>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState('home');
  const [lang,setLang]=useState('КАЗ');
  const [user,setUser]=useState(()=>{
    try{const t=localStorage.getItem('token');return t?{name:'User'}:null;}catch{return null;}
